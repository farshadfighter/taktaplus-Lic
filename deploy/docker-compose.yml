# Local development / single-host deployment of the license server.
#   make db-up                     # PostgreSQL only, for `make run`
#   docker compose -f deploy/docker-compose.yml up -d --build   # everything
name: taktaplus-lic

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taktaplus_lic
      POSTGRES_PASSWORD: ${TPLIC_DB_PASSWORD:-taktaplus_lic}
      POSTGRES_DB: taktaplus_lic
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taktaplus_lic"]
      interval: 5s
      retries: 10

  licserver:
    build: ..
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TPLIC_LISTEN: ":8080"
      TPLIC_DATABASE_URL: postgres://taktaplus_lic:${TPLIC_DB_PASSWORD:-taktaplus_lic}@postgres:5432/taktaplus_lic?sslmode=disable
      TPLIC_MASTER_KEY: ${TPLIC_MASTER_KEY:?set TPLIC_MASTER_KEY}
      TPLIC_COOKIE_SECURE: ${TPLIC_COOKIE_SECURE:-true}
      TPLIC_PUBLIC_URL: ${TPLIC_PUBLIC_URL:-}
      TPLIC_DATA_DIR: /var/lib/taktaplus-lic
      # Encrypted signing keys (lictool keygen), mounted from ./keys.
      TPLIC_LICENSE_KEY_FILE: ${TPLIC_LICENSE_KEY_FILE:-}
      TPLIC_LICENSE_KEY_PASSPHRASE: ${TPLIC_LICENSE_KEY_PASSPHRASE:-}
      TPLIC_PACKAGE_KEY_FILE: ${TPLIC_PACKAGE_KEY_FILE:-}
      TPLIC_PACKAGE_KEY_PASSPHRASE: ${TPLIC_PACKAGE_KEY_PASSPHRASE:-}
    ports:
      - "8080:8080"
    volumes:
      - data:/var/lib/taktaplus-lic
      - ./keys:/keys:ro

volumes:
  data:
  pgdata:
